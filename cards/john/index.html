<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#111827">
<title>John Smith | Digital Business Card</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#eef1f5;color:#111827}
.wrap{max-width:430px;margin:auto;padding:18px}
.card{background:#fff;border-radius:26px;overflow:hidden;box-shadow:0 12px 35px rgba(0,0,0,.12)}
.hero{padding:32px 22px 26px;text-align:center;background:linear-gradient(145deg,#111827,#374151);color:#fff}
.avatar{width:96px;height:96px;border-radius:50%;margin:auto auto 14px;background:#fff;color:#111827;display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:700;border:4px solid rgba(255,255,255,.8)}
h1{font-size:26px;margin:0 0 5px}.role{opacity:.85}.company{font-weight:700;margin-top:5px}
.actions{padding:22px;display:grid;grid-template-columns:1fr 1fr;gap:12px}
a,button{font:inherit}
.action{min-height:54px;border:1px solid #d7dce3;border-radius:15px;text-decoration:none;color:#111827;background:#fff;display:flex;align-items:center;justify-content:center;gap:7px;font-weight:700}
.primary{background:#111827;color:#fff;border-color:#111827}
.about{padding:0 24px 20px;text-align:center;color:#596273;line-height:1.5}
.save{display:block;width:calc(100% - 44px);margin:0 22px 22px;padding:16px;border:0;border-radius:15px;background:#111827;color:#fff;font-weight:700;cursor:pointer}
.small{text-align:center;color:#7b8493;font-size:12px;padding-bottom:22px}
@media(max-width:340px){.actions{grid-template-columns:1fr}}
</style>
</head>
<body>
<main class="wrap">
<section class="card">
<header class="hero">
<div class="avatar">JS</div>
<h1>John Smith</h1>
<div class="role">Director</div>
<div class="company">Expo Services Australia</div>
</header>

<div class="actions">
<a class="action primary" href="tel:+61421701204">Call📞 0421701204</a>
<a class="action" href="mailto:john@example.com">E-mail✉️ xexponow@outlook.com</a>
<a class="action" href="https://wa.me/61412345678" target="_blank" rel="noopener">💬 WhatsApp</a>
<a class="action" href="https://maps.google.com/?q=Sydney+NSW" target="_blank" rel="noopener">📍 Location</a>
<a class="action" href="https://example.com" target="_blank" rel="noopener">🌐 Website</a>
<a class="action" href="https://www.linkedin.com" target="_blank" rel="noopener">in LinkedIn</a>
</div>

<div class="about">
Professional services across Sydney and NSW.<br>
Available for enquiries, quotes and appointments.
</div>

<button class="save" id="save">📇 Save Contact</button>
<div class="small">Tap any button above to connect</div>
</section>
</main>

<script>
document.getElementById("save").addEventListener("click", function(){
const vcard = [
"BEGIN:VCARD","VERSION:3.0",
"FN:John Smith",
"ORG:ABC Services Australia",
"TITLE:Director",
"TEL;TYPE=CELL:+61412345678",
"EMAIL:john@example.com",
"URL:https://example.com",
"ADR;TYPE=WORK:;;Sydney;NSW;;;Australia",
"END:VCARD"
].join("\r\n");
const blob = new Blob([vcard], {type:"text/vcard"});
const url = URL.createObjectURL(blob);
const a = document.createElement("a");
a.href = url;
a.download = "John-Smith.vcf";
a.click();
setTimeout(()=>URL.revokeObjectURL(url),1000);
});
</script>
</body>
</html>

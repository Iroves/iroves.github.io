<style>
:root{color-scheme:dark;--light:#dbe7ef;--blue:#44a8d6;--green:#a4c666}
*{box-sizing:border-box}
html{background:#02060b}
body{margin:0;background:radial-gradient(ellipse at center top,#1b2f3b,#02050a 71%);color:var(--light);font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif}
main{width:min(100%,600px);margin:0 auto;background:#06121e;overflow:hidden;box-shadow:0 18px 85px #000d}
.art{width:100%;position:relative;aspect-ratio:941/1672;isolation:isolate;background:#05101a}
.poster{position:absolute;inset:0;width:100%;height:100%;display:block;object-fit:cover;user-select:none;pointer-events:none;-webkit-user-drag:none}
.motion{position:absolute;inset:0;pointer-events:none;z-index:2;-webkit-mask-image:url('assets/motion_mask.png');mask-image:url('assets/motion_mask.png');-webkit-mask-size:100% 100%;mask-size:100% 100%;opacity:.95}
.motion svg{width:100%;height:100%;display:block}
.streak{fill:none;stroke-linecap:round;stroke-dasharray:235 1520;animation:streak 1.35s linear infinite}
.blue{stroke:#4fb9e0;stroke-width:3.0}.green{stroke:#a8cf68;stroke-width:2.7;animation-duration:1.62s}.silver{stroke:#d6e4ee;stroke-width:1.5;animation-duration:1.24s;opacity:.82}
.halo{stroke-width:12;opacity:.2;filter:url(#soft)}
.a{animation-delay:-.4s}.b{animation-delay:-.8s}.c{animation-delay:-1.14s}.d{animation-delay:-1.5s}.e{animation-delay:-.24s}
@keyframes streak{from{stroke-dashoffset:1780}to{stroke-dashoffset:-1780}}
/* All four circles on the artwork are real interactive touch targets. */
.hotspot{position:absolute;z-index:5;text-decoration:none;display:block;outline:0;border-radius:50%;transition:box-shadow .2s ease,transform .2s ease;background:transparent;-webkit-tap-highlight-color:transparent}
.hotspot:hover,.hotspot:focus-visible{box-shadow:0 0 0 2px #cce6ee9a,0 0 18px #7eb3d850;transform:scale(1.035)}
.hotspot:active{transform:scale(.95)}
.call,.sms,.email,.save{top:66.6%;width:17%;height:9.7%;transform:translateX(-50%)}
.call{left:15.35%}.sms{left:37.9%}.email{left:60.6%}.save{left:83.4%}
.call:hover,.call:focus-visible,.sms:hover,.sms:focus-visible,.email:hover,.email:focus-visible,.save:hover,.save:focus-visible{transform:translateX(-50%) scale(1.035)}
/* Clickable framed cards match their poster locations. */
.card{position:absolute;z-index:5;top:77.85%;height:17.55%;width:22.15%;border-radius:12px;text-decoration:none;transition:box-shadow .2s,transform .2s;outline:0}
.card:hover,.card:focus-visible{box-shadow:inset 0 0 0 2px #dbe7f0,0 0 20px #62a6d96b;transform:translateY(-2px)}
.work{left:2.7%}.printing{left:26.65%}.stands{left:50.4%}.quote{left:74.6%}
.sr-only{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
/* Transparent Select Print website / locations footer. */
/* New dedicated continuation artwork, not a stretched / mirrored poster. */
.bottom{position:relative;isolation:isolate;background:#06121e url('assets/footer_background_natural_continuation.webp') center top/100% auto no-repeat}
.bottom img{position:relative;z-index:2;display:block;width:100%;height:auto}
.footer-motion{position:absolute;inset:0;z-index:1;pointer-events:none;overflow:hidden}
.footer-motion svg{display:block;width:100%;height:100%}
.footer-motion .streak{opacity:.6;stroke-width:2.2}
.footer-motion .silver{stroke-width:1.1;opacity:.4}
.bottom-link{position:absolute;inset:0 auto 0 0;width:49%;z-index:3;border-radius:2px}
.bottom-link:hover,.bottom-link:focus-visible{outline:2px solid #83bfe0;outline-offset:-2px;background:#a1e5ff10}
@media(max-width:450px){.bottom-link{width:50%}}
@media(min-width:620px){body{padding:18px 0 34px}main{border-radius:9px;border:1px solid #1d3442}}
@media(prefers-reduced-motion:reduce){.streak{animation:none;stroke-dasharray:45 1600;opacity:.25}.hotspot,.card{transition:none}}
</style>
</head>

<!DOCTYPE html>
<html lang="en-AU">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#27130b">
  <meta name="description" content="Collective Wedding Styling — luxury wedding styling, exquisite florals and bespoke celebrations.">
  <title>Collective Wedding Styling — Luxury NFC Card</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="digital-card" aria-label="Collective Wedding Styling digital business card">
    <section class="poster" aria-label="Wedding styling luxury card featuring founder portrait, logo and floral wedding styling">
      <picture class="poster-background">
        <source type="image/webp" srcset="assets/luxury-wedding-card.webp">
        <img src="assets/luxury-wedding-card.jpg" alt="Collective Wedding Styling luxury wedding card: Liane, founder, pictured with candlelit wedding flowers, gold accents, company monogram and gallery examples" width="941" height="1672" fetchpriority="high">
      </picture>

      <!-- Animated gold light travels OVER the artwork, crossing the full card. -->
      <svg class="light-trails" viewBox="0 0 941 1672" preserveAspectRatio="none" aria-hidden="true" focusable="false">
        <defs>
          <linearGradient id="light-one" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0" stop-color="#8b390e" stop-opacity=".1"/>
            <stop offset=".28" stop-color="#ffc46e" stop-opacity=".85"/>
            <stop offset=".5" stop-color="#fffbe7" stop-opacity="1"/>
            <stop offset=".73" stop-color="#ffe2a5" stop-opacity=".95"/>
            <stop offset="1" stop-color="#a95520" stop-opacity=".2"/>
          </linearGradient>
          <filter id="light-glow" x="-40%" y="-80%" width="180%" height="260%">
            <feGaussianBlur stdDeviation="4" result="blur"/>
            <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
          </filter>
        </defs>
        <g class="trail-group" fill="none" stroke="url(#light-one)" stroke-linecap="round" filter="url(#light-glow)">
          <path class="trail t1" pathLength="1000" d="M -170 245 C 58 410 158 455 302 472 S 635 460 1090 605" />
          <path class="trail t2" pathLength="1000" d="M -140 285 C 160 470 315 420 467 492 S 719 657 1070 515" />
          <path class="trail t3" pathLength="1000" d="M -165 755 C 70 870 257 825 444 1003 S 711 1230 1085 1280" />
          <path class="trail t4" pathLength="1000" d="M -120 845 C 175 952 303 964 513 1101 S 807 1252 1062 1220" />
          <path class="trail t5" pathLength="1000" d="M -130 1303 C 160 1365 360 1260 524 1294 S 825 1394 1094 1320" />
          <path class="trail t6" pathLength="1000" d="M -115 1480 C 210 1308 342 1471 532 1440 S 791 1342 1056 1511" />
        </g>
        <g class="sparkle-lines" fill="none" stroke="#fff7d8" stroke-linecap="round">
          <path class="sparkle s1" pathLength="1000" d="M -170 245 C 58 410 158 455 302 472 S 635 460 1090 605" />
          <path class="sparkle s2" pathLength="1000" d="M -165 755 C 70 870 257 825 444 1003 S 711 1230 1085 1280" />
          <path class="sparkle s3" pathLength="1000" d="M -130 1303 C 160 1365 360 1260 524 1294 S 825 1394 1094 1320" />
        </g>
      </svg>

      <!-- Transparent, precisely positioned interaction zones over the icons on the artwork. -->
      <nav class="quick-actions" aria-label="Quick action icons">
        <a class="hotspot action booking" href="https://www.collectiveweddingstyling.com.au/copy-of-contact" target="_blank" rel="noopener noreferrer" aria-label="Book a wedding styling consultation" title="Book a consultation"></a>
        <a class="hotspot action phone" href="tel:1300003040" aria-label="Call Collective Wedding Styling on 1300 003 040" title="Call"></a>
        <a class="hotspot action instagram" href="https://www.instagram.com/collectiveweddingstyling/" target="_blank" rel="noopener noreferrer" aria-label="Visit Collective Wedding Styling on Instagram" title="Instagram"></a>
        <a class="hotspot action portfolio" href="https://www.collectiveweddingstyling.com.au/our-work" target="_blank" rel="noopener noreferrer" aria-label="See the wedding portfolio" title="View portfolio"></a>
        <button class="hotspot action contact" type="button" id="saveContact" aria-label="Save Collective Wedding Styling to your contacts" title="Save contact"></button>
      </nav>

      <nav class="service-hotspots" aria-label="Examples of our wedding styling services">
        <a class="hotspot service florals" href="https://www.collectiveweddingstyling.com.au/weddingfloralssydneyweddingfloralsqueensland" target="_blank" rel="noopener noreferrer" aria-label="Explore wedding florals" title="Wedding Florals"></a>
        <a class="hotspot service centrepieces" href="https://www.collectiveweddingstyling.com.au/copy-of-wedding-florals" target="_blank" rel="noopener noreferrer" aria-label="Explore wedding centrepieces" title="Wedding Centrepieces"></a>
        <a class="hotspot service dance" href="https://www.collectiveweddingstyling.com.au/copy-of-home-wedding-styling" target="_blank" rel="noopener noreferrer" aria-label="Explore wedding dance floors" title="Wedding Dance Floors"></a>
        <a class="hotspot service styling" href="https://www.collectiveweddingstyling.com.au/copy-of-wedding-centrepieces" target="_blank" rel="noopener noreferrer" aria-label="Explore bridal home styling" title="Bridal Home Styling"></a>
      </nav>
    </section>

    <!-- Labels are separate from the approved poster artwork. They line up precisely
         with the four photographs above and are themselves tappable. -->
    <nav class="service-captions" aria-label="Explore wedding styling services">
      <a class="service-caption" href="https://www.collectiveweddingstyling.com.au/weddingfloralssydneyweddingfloralsqueensland" target="_blank" rel="noopener noreferrer" aria-label="Discover bespoke wedding florals, including bouquets and backdrops">
        <span class="caption-title">Wedding<br>Florals</span>
        <span class="caption-description">Bouquets &amp;<br>backdrops</span>
        <span class="caption-arrow" aria-hidden="true">↗</span>
      </a>
      <a class="service-caption" href="https://www.collectiveweddingstyling.com.au/copy-of-wedding-florals" target="_blank" rel="noopener noreferrer" aria-label="Explore luxurious floral wedding centrepieces">
        <span class="caption-title">Wedding<br>Centrepieces</span>
        <span class="caption-description">Beautifully styled<br>tables</span>
        <span class="caption-arrow" aria-hidden="true">↗</span>
      </a>
      <a class="service-caption" href="https://www.collectiveweddingstyling.com.au/copy-of-home-wedding-styling" target="_blank" rel="noopener noreferrer" aria-label="Discover statement wedding dance floors">
        <span class="caption-title">Dance<br>Floors</span>
        <span class="caption-description">Dance in<br>style</span>
        <span class="caption-arrow" aria-hidden="true">↗</span>
      </a>
      <a class="service-caption" href="https://www.collectiveweddingstyling.com.au/copy-of-wedding-centrepieces" target="_blank" rel="noopener noreferrer" aria-label="Explore bridal home styling for the bride and groom">
        <span class="caption-title">Bridal Home<br>Styling</span>
        <span class="caption-description">From home to<br>celebration</span>
        <span class="caption-arrow" aria-hidden="true">↗</span>
      </a>
    </nav>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
  </main>
  <script src="script.js"></script>
</body>
</html>

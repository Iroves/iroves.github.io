<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#06152b">
  <meta name="description" content="Connect with Iro.">
  <title>Iro · Connect</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
  <script src="contact.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <main class="card" aria-labelledby="name">
    <div class="photographs" aria-hidden="true">
      <img class="sunset" src="assets/sunset.jpg" alt="" decoding="async">
      <img class="portrait" src="assets/portrait.jpg" alt="" fetchpriority="high">
      <img class="motorbike" src="assets/motorbike.jpg" alt="" decoding="async">
      <div class="blue-wash"></div>
    </div>
    <svg class="gold-lines" viewBox="0 0 440 850" preserveAspectRatio="none" aria-hidden="true">
      <defs>
        <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">

          <stop offset=".83" stop-color="#b38b48"/>
          <stop offset="1" stop-color="#a17735" stop-opacity="0"/>

        <path d="M-70 620 C170 500 -100 290 70 170 S280 80 420 -40"/>

<path d="M278 1000 C628 790 298 775 473 575 S498 320 603 200"/>
</g>
      <g class="travelling" fill="none" stroke="#ffe7a9" stroke-width="1.3" stroke-linecap="round" stroke-dasharray="24 1200">
        <path pathLength="1200" d="M-46 656 C192 536 -76 326 94 206 S304 116 444 -4"/>

    </svg>
    <header class="masthead">
      <span class="monogram" aria-hidden="true">i<span>.</span></span>
      <button class="motion-toggle" id="motion" type="button" aria-pressed="false" aria-label="Pause moving gold lines" title="Pause moving gold lines">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 7v10M15 7v10"/></svg>
      </button>
    </header>
    <section class="identity">
      <span class="eyebrow"><span></span> LET’S CONNECT</span>
      <h1 id="name">Iro<span>.</span></h1>
      <div class="identity-rule"></div>
    </section>
    <section class="connect" aria-label="Contact Iro">
      <div class="contact-links">
        <a class="contact-link" id="phone" href="tel:0421701204">
          <span class="icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3 4.5 4.5c-1.5 1.5.5 6.5 4.5 10.5s9 6 10.5 4.5L21 16l-5-3-2 2a17 17 0 0 1-5-5l2-2-3-5Z"/></svg></span>
          <span class="label"><span class="link-title">Mobile</span><span class="link-detail" id="phone-detail">0421 701 204</span></span>
          <span class="arrow" aria-hidden="true">↗</span>
        </a>
        <a class="contact-link" id="instagram" href="https://www.instagram.com/IroBarcellos/" target="_blank" rel="noopener noreferrer">
          <span class="icon"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle class="solid" cx="17.5" cy="6.5" r="1"/></svg></span>
          <span class="label"><span class="link-title">Instagram</span><span class="link-detail" id="instagram-detail">@IroBarcellos</span></span>
          <span class="arrow" aria-hidden="true">↗</span>
        </a>
      </div>
      <button class="save-contact" id="save" type="button" disabled>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12m-4-4 4 4 4-4M5 16v5h14v-5"/></svg>
        Save contact
      </button>
      <p class="status" id="status" role="status" aria-live="polite"></p>
    </section>
    <footer><span></span><span>IRO</span><span></span></footer>
  </main>

</html>

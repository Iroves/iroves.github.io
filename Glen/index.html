<!doctype html>
<html lang="en-AU">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#091d36">
  <meta name="description" content="Glen Coxon — Master Painter & Decorator. Over 20 years experience. Restoration, interiors and exteriors.">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Glen Coxon | Master Painter & Decorator">
  <meta property="og:description" content="Restoration • Interiors • Exteriors. Call Glen on 0422 962 582.">
  <meta property="og:image" content="assets/glen-portrait.webp">
  <title>Glen Coxon · Master Painter & Decorator</title>
  <link rel="preload" as="image" href="assets/glen-portrait.webp">
  <link rel="stylesheet" href="style.css">
  <script src="config.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <main class="site">
    <article class="profile" aria-label="Glen Coxon's digital business card">
      <div class="moving-layer" aria-hidden="true">
        <video id="motionVideo" autoplay muted loop playsinline webkit-playsinline preload="metadata" poster="assets/blue-motion-poster.jpg">
          <source src="assets/blue-paint-motion.mp4" type="video/mp4">
        </video>
        <div class="moving-wash"></div>
      </div>
      <div class="light-arc" aria-hidden="true"></div>

      <header class="topline">
        <span class="monogram" aria-hidden="true">GC<span>.</span></span>
        <span class="topline-trade">MASTER PAINTER<br>&amp; DECORATOR</span>
        <span class="topline-mark" aria-label="Digital business card">DIGITAL CARD</span>
      </header>

      <section class="hero" aria-label="About Glen Coxon">
        <div class="hero-copy">
          <p class="eyebrow">THE ART OF A PERFECT FINISH</p>
          <h1 id="fullName">Glen <em>Coxon</em></h1>
          <p id="tradeTitle" class="trade">Master Painter &amp; Decorator</p>
          <p class="experience"><strong id="experience">20+</strong><span>YEARS<br>EXPERIENCE</span></p>
          <p class="perfectionist">— Perfectionist —</p>
          <div class="service-inline" aria-label="Services">
            <span>RESTORATION</span><b>·</b><span>INTERIORS</span><b>·</b><span>EXTERIORS</span>
          </div>
        </div>
        <div class="portrait-wrap" aria-label="Portrait of Glen Coxon">
          <div class="portrait-halo"></div>
          <img class="portrait" id="portrait" src="assets/glen-portrait.webp" alt="Glen Coxon in painter's work clothes" fetchpriority="high">
          <div class="portrait-blend" aria-hidden="true"></div>
        </div>
      </section>

      <section class="actions" aria-label="Contact Glen">
        <a class="action primary" id="callBtn" href="tel:+61422962582">
          <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M22 16.9v3a2 2 0 0 1-2.2 2A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7l.5 3.1a2 2 0 0 1-.6 1.8L7.2 10a16 16 0 0 0 6.8 6.8l1.4-1.8a2 2 0 0 1 1.8-.6l3.1.5a2 2 0 0 1 1.7 2z"/></svg>
          <span id="callText">Call 0422 962 582</span>
        </a>
        <a class="action secondary" id="messageBtn" href="sms:+61422962582">
          <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M21 11.5a8.5 8.5 0 0 1-8.5 8.5 9 9 0 0 1-4-.9L3 21l1.7-4.6A8.5 8.5 0 1 1 21 11.5z"/></svg>
          <span>Send a message</span>
        </a>
        <button class="action outline" id="saveContact" type="button">
          <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M12 3v12m-4-4 4 4 4-4M4 16v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3"/></svg>
          <span>Save contact</span>
        </button>
      </section>

      <div class="subline">
        <span>RESTORATION <i>•</i> INTERIORS <i>•</i> EXTERIORS</span>
        <button id="shareCard" type="button" class="share-button" aria-label="Share Glen Coxon's card">
          <svg aria-hidden="true" viewBox="0 0 24 24"><circle cx="18" cy="5" r="3"/><circle cx="5" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="m8 11 7-5M8 13l7 5"/></svg>
          Share card
        </button>
      </div>
      <footer class="footer"><span>GLEN COXON</span><span>QUALITY IS IN THE DETAILS</span></footer>
    </article>
  </main>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</body>
</html>
